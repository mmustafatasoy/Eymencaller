name: APK Derle

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # V13-01: kalıcı imza anahtarı (repo herkese açık → anahtar sadece GitHub secret'ta)
      - name: İmza anahtarı
        env:
          EYMEN_IMZA: ${{ secrets.EYMEN_IMZA }}
        run: |
          if [ -n "$EYMEN_IMZA" ]; then
            echo "$EYMEN_IMZA" | base64 -d > "$RUNNER_TEMP/eymen.jks"
            echo "EYMEN_KEYSTORE=$RUNNER_TEMP/eymen.jks" >> "$GITHUB_ENV"
            echo "Kalıcı imza anahtarı kullanılıyor."
          else
            echo "::warning::EYMEN_IMZA secret yok — APK geçici anahtarla imzalanıyor (her derlemede değişir, üstüne kurulmaz)."
          fi
      - name: Release + Debug APK + Lint
        env:
          EYMEN_KEYSTORE_SIFRE: EymenTelefon2026
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug lintDebug --stacktrace
      - name: Release APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: EymenTelefon-release
          path: app/build/outputs/apk/release/*.apk
      - name: Debug APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: EymenTelefon-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Lint raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-raporu
          path: app/build/reports/lint-results-debug.html
